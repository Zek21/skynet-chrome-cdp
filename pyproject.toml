[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skynet-chrome-cdp"
version = "1.3.0"
description = "Attach to the Chrome you are already signed into. Zero dependencies."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Exzil Calanza" }]
keywords = ["chrome", "cdp", "devtools", "browser-automation", "accessibility", "agent"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
  "Topic :: Internet :: WWW/HTTP :: Browsers",
]

# No runtime dependencies. This is a specified property (SPEC.md clause 4.2),
# not an accident, and the empty list is the assertion.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/Zek21/skynet-chrome-cdp"
Specification = "https://github.com/Zek21/skynet-chrome-cdp/blob/master/SPEC.md"

[project.scripts]
skynet-cdp-benchmark = "skynet_chrome_cdp.benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
